# ==========================================
# 1. DATABASE CONFIGURATION (Cloud Ready for Render)
# ==========================================
# Render par Environment Variables (${...}) inject honge
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# 2. HIBERNATE & JPA CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# (Dialect wali line hata di gayi hai taaki classNotFound error na aaye)

# ==========================================
# 3. EMAIL ALERT CONFIGURATION (GMAIL SMTP)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tumhara_email@gmail.com
spring.mail.password=tumhara_16_digit_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# 4. CORS CONFIGURATION (To fix BeanCreationException)
# ==========================================
app.cors.allowed-origin=*